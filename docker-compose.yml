services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: batisso
      POSTGRES_PASSWORD: batisso
      POSTGRES_DB: batisso
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U batisso -d batisso']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
