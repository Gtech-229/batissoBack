# Production on the VPS: the API and PostgreSQL (18a) behind Nginx with HTTPS
# (18b), and the nightly encrypted backups (18c). Settings and secrets come from
# four git-ignored files, each read only by its own services: .env.production
# (API), .env.db.production (database, backups), .env.proxy.production (Nginx,
# certbot) and .env.backup.production (backups); start from their .example
# files. The dev docker-compose.yml is separate.
#
# Two ways to run, chosen by the `proxy` profile:
# - Our own Nginx and certbot (ports 80 and 443): put COMPOSE_PROFILES=proxy in
#   a `.env` file next to this one (Compose reads it by itself; it never reaches
#   the image). First deploy: README "Production on a VPS" (database and API,
#   then the first certificate, then everything): Nginx cannot start before a
#   certificate exists.
# - Behind the VPS's own web server (ISPConfig, another Nginx): no profile, so
#   `up` starts only db, api and backup; the web server proxies HTTPS to
#   127.0.0.1:3000. README "Behind an existing web server (ISPConfig)".
# Afterwards, either way: docker compose -f docker-compose.prod.yml up -d --build
#
# Two networks: `edge` (nginx, certbot, api) reaches the internet; `data`
# (api, db, backup) is internal. Only the API is on both.
#
# `down` keeps the four volumes (database, private files, certificates and
# challenges); only `down -v` deletes them (never by mistake).
name: batisso-prod

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB only: the database never
    # sees the API's secrets.
    env_file: .env.db.production
    # Sized for the 4 GB, 2-CPU VPS, which also runs the API, Nginx and other
    # work: see README "PostgreSQL settings" to resize for another machine.
    # Slow statements (500 ms+) are logged without their values (phones,
    # names); pg_stat_statements sums up every query.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=50
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=500ms
      - -c
      - log_parameter_max_length=0
    # Docker's 64 MB /dev/shm is too small for parallel queries.
    shm_size: 256mb
    volumes:
      - pgdata-prod:/var/lib/postgresql
      # Runs once, when the volume is created: the pg_stat_statements view.
      - ./docker/postgres-prod/pg_stat_statements.sql:/docker-entrypoint-initdb.d/pg_stat_statements.sql:ro
    # No published port: only the API and the backups reach the database, on
    # the internal `data` network (host `db`).
    networks: [data]
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: batisso-api
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # The private identity photos, proofs and store documents.
      - app-storage:/app/storage
    # `edge` for Nginx and the providers (email, SMS, push), `data` for the
    # database: the only service on both.
    networks: [edge, data]
    # From the VPS itself only, for the operator's checks; from outside, the
    # API is reached through Nginx.
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/v1/health']
      interval: 30s
      timeout: 5s
      # Room for the migrations that run before the server starts.
      start_period: 60s
      retries: 3

  nginx:
    image: nginx:1.30-alpine
    # Only with COMPOSE_PROFILES=proxy (see the top of this file).
    profiles: [proxy]
    restart: unless-stopped
    # The image's own start (it fills the templates), plus a reload every 6 hours
    # so a certificate renewed by certbot is picked up without a restart.
    entrypoint:
      - /bin/sh
      - -c
      - (while :; do sleep 6h; nginx -s reload; done) & exec /docker-entrypoint.sh nginx -g 'daemon off;'
    # API_DOMAIN (and LETSENCRYPT_EMAIL, shared with certbot): the proxy never
    # sees the API's or the database's secrets.
    env_file: .env.proxy.production
    depends_on:
      - api
    # `edge` only: Nginx reaches the API, never the database.
    networks: [edge]
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # default.conf.template becomes /etc/nginx/conf.d/default.conf at start,
      # replacing the image's welcome-page server.
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:v5.8.0
    # Only with COMPOSE_PROFILES=proxy, like Nginx; `run --rm certbot` (the
    # first certificate, README) works either way.
    profiles: [proxy]
    restart: unless-stopped
    # LETSENCRYPT_EMAIL: the account contact, used by the first certificate's
    # command (see README).
    env_file: .env.proxy.production
    # `edge`: Let's Encrypt is on the internet.
    networks: [edge]
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Every 12 hours, renews any certificate due within 30 days through the
    # webroot Nginx serves on port 80; nothing to do otherwise.
    entrypoint:
      - /bin/sh
      - -c
      - trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --no-random-sleep-on-renew; sleep 12h & wait $${!}; done

  backup:
    build: ./docker/backup
    image: batisso-backup
    restart: unless-stopped
    # POSTGRES_* to connect, BACKUP_PASSPHRASE to encrypt: none of the API's
    # secrets.
    env_file:
      - .env.db.production
      - .env.backup.production
    depends_on:
      db:
        condition: service_healthy
    # `data` only: it needs the database (and `api`, whose name refuses a
    # restore while the API runs), never the internet.
    networks: [data]
    volumes:
      - app-storage:/app/storage:ro
      # The encrypted backups, on the VPS next to this file (git-ignored).
      - ./backups:/backups
    # Every day at 01:00 UTC; on demand: run --rm backup backup.sh once
    command: ['backup.sh', 'schedule']

networks:
  # Nginx, certbot and the API: reaches the internet.
  edge:
  # The API, the database and the backups: no route out of the VPS, so the
  # database and the backups can neither be reached from nor reach outside.
  data:
    internal: true

volumes:
  pgdata-prod:
  app-storage:
  # Let's Encrypt certificates and account (18b).
  certbot-etc:
  # The challenge files certbot writes and Nginx serves on port 80.
  certbot-www:
